<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#e4e8ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a22" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Basgiath Training">
<title>Basgiath Training</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e8ec; --surface:#f4f6f8; --ink:#1b2430; --muted:#58646f;
  --line:#d0d7de; --hexline:#8793a1; --on-accent:#ffffff;
  --a-parapet:#3b6ea5; --a-gauntlet:#1f7a66; --a-threshing:#c4491f;
  --a-flex:#6d4fa3; --a-dragon:#b3261e; --water:#2f7fc1;
  --accent:var(--a-parapet);
  --head:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141a22; --surface:#1e2630; --ink:#e6e9ee; --muted:#9aa6b4;
    --line:#2f3a47; --hexline:#5b6878; --on-accent:#0e141b;
    --a-parapet:#7fb0e3; --a-gauntlet:#6fcdb4; --a-threshing:#ef7a4d;
    --a-flex:#b69be6; --a-dragon:#ff7d73; --water:#6db4f0;
  }
}
body[data-day="parapet"]{--accent:var(--a-parapet)}
body[data-day="gauntlet"]{--accent:var(--a-gauntlet)}
body[data-day="threshing"]{--accent:var(--a-threshing)}
body[data-day="flex"]{--accent:var(--a-flex)}
body[data-day="dragon"]{--accent:var(--a-dragon)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 16px/1.45 var(--body);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(96px + env(safe-area-inset-bottom,0px));
}
.app{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.rider{margin:0;font:700 28px/1 var(--head);letter-spacing:.01em}
.unit{margin:3px 0 0;font-size:14px;color:var(--muted)}
.unit button{padding:0;border:0;background:none;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;min-height:28px;text-align:left}
.chip{
  flex:0 0 auto;min-height:44px;min-width:64px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--accent);background:transparent;color:var(--accent);
  font:700 20px/1 var(--head);letter-spacing:.02em;
}

/* hero */
.hero{position:relative;border-radius:14px;overflow:hidden;background:#1e2630;isolation:isolate}
.hero-img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:62% 28%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,14,20,.9) 0%,rgba(10,14,20,.55) 38%,rgba(10,14,20,0) 72%)}
.hero-text{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;color:#fff}
.day-name{font:700 clamp(44px,14vw,60px)/.92 var(--head);margin:0 0 4px;letter-spacing:.005em}
.focus{margin:0;font-weight:600;color:#fff}
.flavor{margin:2px 0 0;font-style:italic;color:rgba(255,255,255,.85)}
.progress{margin:18px 0 22px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.prog-text{margin:6px 0 0;font-size:14px;color:var(--muted)}
.lede{margin:16px 0 18px;color:var(--muted)}

/* sections */
.section{background:var(--surface);border-radius:12px;padding:6px 16px 4px;margin:0 0 16px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 8px}
.sec-head h2{margin:0;font:600 24px/1 var(--head);letter-spacing:.01em}
.sec-head span{font-size:14px;color:var(--muted)}
.item{padding:14px 0 16px;border-top:1px solid var(--line)}
.name{margin:0;font-weight:600;font-size:17px}
.rx{margin:1px 0 0;color:var(--accent);font-weight:600}
.note{margin:3px 0 0;font-size:14px;color:var(--muted)}
.hexes{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}

/* scale-shaped markers */
.hex{
  --hx:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  position:relative;width:48px;height:48px;border:0;padding:0;margin:0;
  background:var(--hexline);clip-path:var(--hx);cursor:pointer;
  font-weight:600;font-size:16px;-webkit-tap-highlight-color:transparent;
}
.hex::before{content:"";position:absolute;inset:2px;background:var(--surface);clip-path:var(--hx)}
.hex span{position:relative;display:grid;place-items:center;width:100%;height:100%}
.hex .c{display:none}
.hex[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.hex[aria-pressed="true"]::before{background:var(--accent)}
.hex[aria-pressed="true"] .n{display:none}
.hex[aria-pressed="true"] .c{display:grid}
.hex:active{transform:scale(.93)}
.hex:focus-visible{background:var(--ink)}
.hex:focus-visible::before{inset:4px}

/* buttons and fields */
.btn{
  min-height:48px;padding:0 18px;border-radius:8px;border:1.5px solid var(--hexline);
  background:transparent;font-weight:600;cursor:pointer;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.unit button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.input{width:100%;min-height:48px;padding:0 12px;border-radius:8px;border:1.5px solid var(--hexline);background:var(--bg);color:var(--ink);font:inherit}
.input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{padding:4px 0 12px}

/* optional flows */
.flow{padding:0}
.flow summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:60px;cursor:pointer}
.flow summary::-webkit-details-marker{display:none}
.flow summary:focus-visible{outline:3px solid var(--ink);outline-offset:-3px;border-radius:12px}
.fl-title{flex:1;min-width:0;font:600 22px/1.1 var(--head);letter-spacing:.01em}
.fl-title em{display:block;margin-top:2px;font:italic 400 14px/1.2 var(--body);color:var(--muted);letter-spacing:0}
.badge{flex:0 0 auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1.5px solid var(--hexline);color:var(--muted)}
.fl-count{flex:0 0 auto;font-size:14px;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.flow summary::after{content:"";flex:0 0 auto;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .2s}
.flow[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.flow-body{padding:0 16px 10px}
.flow-intro{margin:0 0 10px;color:var(--muted);font-size:15px}
.tip{margin:0 0 6px;padding:10px 12px;border-radius:6px;background:var(--bg);border-left:3px solid var(--accent);font-size:14px}
.group h3{margin:16px 0 4px;font:600 20px/1 var(--head);letter-spacing:.02em;color:var(--accent)}
.flow .link-btn{margin:10px 0 6px;min-height:44px}

/* circuit timer */
.circuit{
  margin-top:14px;padding:18px 16px;border-radius:10px;
  background:var(--bg);color:var(--ink);text-align:center;
  border:1.5px solid var(--line);
}
.circuit[data-phase="work"],.circuit[data-phase="ready"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.c-phase{margin:0;font:600 22px/1 var(--head);letter-spacing:.02em}
.c-time{margin:4px 0 2px;font:700 84px/1 var(--head);font-variant-numeric:tabular-nums}
.c-station{margin:0;font-weight:600;font-size:20px}
.c-meta{margin:4px 0 0;font-size:14px;opacity:.85}
.c-actions{display:flex;gap:10px;justify-content:center;margin-top:16px}
.circuit[data-phase="work"] .btn,.circuit[data-phase="ready"] .btn{border-color:var(--on-accent)}
.circuit[data-phase="work"] .btn.primary,.circuit[data-phase="ready"] .btn.primary{background:var(--on-accent);color:var(--accent);border-color:var(--on-accent)}
.circuit[data-phase="work"] .btn:focus-visible,.circuit[data-phase="ready"] .btn:focus-visible{outline-color:var(--on-accent)}

/* footer */
.footer{margin-top:8px}
.log-status{margin:0 0 12px;font-size:14px;color:var(--muted)}
.f-actions{display:flex;gap:10px;flex-wrap:wrap}

/* dragon tab */
.dh{display:block;color:var(--a-dragon)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 -16px}
.stat{padding:12px 16px;border-top:1px solid var(--line)}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat small{display:block;font-size:13px;color:var(--muted)}
.stat b{display:block;font:700 34px/1.05 var(--head);letter-spacing:.01em}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0 6px}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.meter-note{margin:0;font-size:14px;color:var(--muted)}
.ladder{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;padding:14px 4px 0}
.rung{display:flex;flex-direction:column;align-items:center;gap:6px}
.rung .dh{color:var(--hexline);opacity:.5}
.rung.reached .dh{color:var(--a-dragon);opacity:1}
.rung.now::after{content:"";width:100%;height:4px;border-radius:2px;background:var(--accent)}
.rung:not(.now)::after{content:"";height:4px}
.care-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.care-row b{font:700 40px/1 var(--head)}
.care-row span{color:var(--muted);font-size:14px;text-align:right}
.care-block{padding:16px 0;border-top:1px solid var(--line)}
.care-block h3{margin:0 0 2px;font:600 20px/1.1 var(--head);letter-spacing:.02em}
.care-block p{margin:0}
.drops{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.drops svg{width:30px;height:30px;color:var(--line)}
.drops svg.on{color:var(--water)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.week{display:flex;gap:6px;align-items:flex-end;height:104px;padding-top:6px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.wbar{width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--hexline);min-height:4px}
.wcol.today .wbar{background:var(--accent)}
.wcol small{font-size:12px;color:var(--muted)}
.wcol.today small{color:var(--ink);font-weight:600}

/* gate */
.gate{position:fixed;inset:0;z-index:30;overflow:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gate-in{max-width:460px;margin:0 auto}
.gate .hero{margin-bottom:20px}
.gate .input{background:var(--surface)}
.gate h2{margin:0 0 4px;font:700 34px/1 var(--head)}
.gate .sub{margin:0 0 18px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;margin:0 0 14px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.err{min-height:22px;margin:0 0 8px;color:#b3261e;font-weight:600}
@media (prefers-color-scheme:dark){.err{color:#ff8f86}}
.gate .btn.primary{width:100%;min-height:52px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:12px 16px;margin:0 0 10px;text-align:left;border-radius:12px;border:1.5px solid var(--hexline);background:var(--surface);cursor:pointer}
.pick b{display:block;font:700 26px/1 var(--head)}
.pick small{color:var(--muted)}
.pick .lv{font:700 22px/1 var(--head);color:var(--a-dragon)}
.pick:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.gate .link{display:block;margin:14px auto 0;padding:0 8px;min-height:44px;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer}

/* rest sheet */
.sheet{
  position:fixed;left:12px;right:12px;margin:0 auto;max-width:536px;
  bottom:calc(72px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px 12px 18px;border-radius:12px;
  background:var(--ink);color:var(--bg);
  box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:5;
}
.sheet-label{margin:0;font-size:14px;opacity:.8}
.sheet-time{margin:0;font:700 40px/1 var(--head);font-variant-numeric:tabular-nums}
.sheet-actions{display:flex;gap:8px}
.sheet .btn{min-height:44px;border-color:var(--bg);color:var(--bg)}
.sheet .btn:focus-visible{outline-color:var(--bg)}

/* tabs */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tab{
  flex:1;min-width:0;border:0;background:transparent;cursor:pointer;min-height:64px;
  padding:10px 2px 8px;color:var(--muted);position:relative;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  -webkit-tap-highlight-color:transparent;
}
.tab small{font-size:11px}
.tab b{font:600 16px/1 var(--head);letter-spacing:0;white-space:nowrap}
.tab[data-day="parapet"]{--t:var(--a-parapet)}
.tab[data-day="gauntlet"]{--t:var(--a-gauntlet)}
.tab[data-day="threshing"]{--t:var(--a-threshing)}
.tab[data-day="flex"]{--t:var(--a-flex)}
.tab[data-day="dragon"]{--t:var(--a-dragon)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:16%;right:16%;height:4px;border-radius:0 0 4px 4px;background:var(--t)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ================= Storage ================= */
const KEY = "basgiath-training-v2";
const AUTH_KEY = "basgiath-auth";
let root = {profiles:{}, order:[], current:null, tab:"parapet"};

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && typeof o === "object"){
        if(o.profiles && typeof o.profiles === "object") root.profiles = o.profiles;
        if(Array.isArray(o.order)) root.order = o.order.filter(id => root.profiles[id]);
        if(o.current && root.profiles[o.current]) root.current = o.current;
        if(TABS.some(t => t.id === o.tab)) root.tab = o.tab;
      }
    }
  }catch(e){}
  Object.keys(root.profiles).forEach(id => fixProfile(root.profiles[id]));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(root)); }catch(e){} }

function fixProfile(p){

  if(!Array.isArray(p.log)) p.log = [];
  return p;
}

/* ================= Auth ================= */
function cyrb53(str, seed){
  seed = seed || 0;
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i = 0, ch; i < str.length; i++){
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1>>>0)).toString(16);
}
async function pwOk(s){
  try{
    if(window.crypto && crypto.subtle){
      const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
      const hex = Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,"0")).join("");
      return hex === PW_SHA;
    }
  }catch(e){}
  return cyrb53(s) === PW_CYRB;
}
function isAuthed(){
  try{ return localStorage.getItem(AUTH_KEY) === "1" || sessionStorage.getItem(AUTH_KEY) === "1"; }catch(e){ return false; }
}
function setAuthed(keep){
  try{ (keep ? localStorage : sessionStorage).setItem(AUTH_KEY, "1"); }catch(e){}
}
function clearAuth(){
  try{ localStorage.removeItem(AUTH_KEY); sessionStorage.removeItem(AUTH_KEY); }catch(e){}
}

const levelOf = n => 1 + Math.floor(n / SESSIONS_PER_LEVEL);
function stageOf(n){ let i = 0; STAGES.forEach((s,k) => { if(n >= s.at) i = k; }); return i; }
function healthOn(p, date){
  const w = Math.min(50, Math.round((p.water[date] || 0) / GOAL * 50));
  const s = p.log.some(l => l.date === date) ? HP_SESSION : 0;
  const e = (p.extras[date] || 0) * HP_EXTRA;
  return {total:Math.min(100, w + s + e), w, s, e};
}
const moodOf = h => h >= 80 ? "Thriving" : h >= 50 ? "Steady" : h >= 20 ? "Tired" : "Needs care";

/* ================= Audio, vibration, wake lock ================= */
let actx = null;
function ensureAudio(){
  try{
    if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(C) actx = new C(); }
    if(actx && actx.state === "suspended") actx.resume();
  }catch(e){}
}
function beep(freq, dur, delay){
  try{
    if(!actx) return;
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* ================= Checks ================= */
function staleReset(tab){
  const p = P();
  if(p.touched[tab] && p.touched[tab] !== today()){
    p.checks[tab] = {}; delete p.touched[tab]; save();
  }
}
function isOn(tab, key){ const c = P().checks[tab]; return !!(c && c[key]); }
function setCheck(tab, key, val){
  const p = P();
  if(!p.checks[tab]) p.checks[tab] = {};
  if(val){ p.checks[tab][key] = true; p.touched[tab] = today(); } else delete p.checks[tab][key];
  save();
  if(root.tab === tab){
    const b = document.querySelector(`.hex[data-key="${key}"]`);
    if(b) b.setAttribute("aria-pressed", String(!!val));
    updateProgress(); updateFlowCounts();
  }
}

function itemHTML(tab, it, key, opt, defLabel){
  let h = `<div class="item"><p class="name">${esc(it.name)}</p><p class="rx">${esc(it.rx)}</p>`;
  if(it.note) h += `<p class="note">${esc(it.note)}</p>`;
  h += `<div class="hexes" role="group" aria-label="${esc(it.name)}">`;
  const lab = it.setLabel || defLabel || "Set";
  for(let s = 0; s < it.sets; s++){
    const k = `${key}.${s}`;
    const on = isOn(tab, k);
    const label = it.sets === 1 ? "Done" : `${lab} ${s+1} of ${it.sets}`;
    h += `<button class="hex" type="button" data-key="${k}" data-rest="${it.rest || 0}" data-last="${s === it.sets-1}" data-name="${esc(it.name)}"${opt ? ' data-opt="1"' : ""} aria-pressed="${on}" aria-label="${label}, ${esc(it.name)}"><span class="n">${s+1}</span><span class="c">&#10003;</span></button>`;
  }
  h += `</div>`;
  if(it.circuit) h += `<div id="circuitHost"></div>`;
  return h + `</div>`;
}
function flowHTML(tab, flow, fi, open){
  let h = `<details class="section flow" data-fi="${fi}"${open ? " open" : ""}>
    <summary><span class="fl-title">${esc(flow.title)}<em>${esc(flow.when)}</em></span>

    <div class="flow-body"><p class="flow-intro">${esc(flow.intro)}</p>`;

  flow.groups.forEach((g, gi) => {
    h += `<div class="group"><h3>${esc(g.title)}</h3>`;
    g.items.forEach((it, ii) => { h += itemHTML(tab, it, `f${fi}.${gi}.${ii}`, true, g.label); });
    h += `</div>`;

  h += `<button class="btn link-btn" type="button" data-clearflow="${fi}">Clear this flow</button></div></details>`;

function updateProgress(){
  const fill = $("barFill"); if(!fill) return;

function updateFlowCounts(){

function logSession(){
  const p = P(), day = DAYS.find(d => d.id === root.tab);
  const btns = document.querySelectorAll(".hex:not([data-opt])");
  let done = 0; btns.forEach(b => { if(b.getAttribute("aria-pressed") === "true") done++; });
  if(done < btns.length && !confirm(`You've marked ${done} of ${btns.length} sets. Log this session anyway?`)) return;
  const beforeN = sessionsOf(p);
  p.log.push({date:today(), day:day.id});
  save();
  const n = sessionsOf(p);
  let msg = `Session logged. ${p.dragon.name || "Your dragon"} grew stronger.`;
  if(stageOf(n) > stageOf(beforeN)) msg = `Session logged. ${p.dragon.name || "Your dragon"} grew into a ${STAGES[stageOf(n)].name}!`;
  else if(levelOf(n) > levelOf(beforeN)) msg = `Level up! ${p.dragon.name || "Your dragon"} is now level ${levelOf(n)}.`;
  footMsg = msg;
  paintFooter(); renderTopbar(); renderTabs();
  buzz([80,60,80]);
}

  const p = P();
  for(let i = p.log.length - 1; i >= 0; i--){
    if(p.log[i].date === today()){ p.log.splice(i, 1); break; }

  paintFooter(); renderTopbar(); renderTabs();

      <p class="meter-note">${glasses} of ${GOAL} glasses today. Goal reached means +50 health.</p>
      <div class="drops" role="img" aria-label="${glasses} of ${GOAL} glasses of water">${drops}</div>
      <div class="row-btns">
        <button class="btn primary" type="button" data-act="water+">Add a glass</button>
        <button class="btn" type="button" data-act="water-" ${glasses ? "" : "disabled"}>Remove one</button>
      </div>
    </div>

    <div class="care-block">
      <h3>Extra workouts</h3>
      <p class="meter-note">${extras} logged today. Each one adds +${HP_EXTRA} health. A walk, a run, a ride, or an off-day flexibility session all count.</p>
      <div class="row-btns">
        <button class="btn primary" type="button" data-act="extra+">Log extra workout</button>
        <button class="btn" type="button" data-act="extra-" ${extras ? "" : "disabled"}>Remove one</button>
      </div>
    </div>

    <div class="care-block">
      <h3>This week</h3>
      <div class="week">${week}</div>
    </div>`;
}

/* ================= Rest timer ================= */
const rest = {end:0, timer:null, hideId:null};
function startRest(sec, label){
  clearTimeout(rest.hideId);
  rest.end = Date.now() + sec * 1000;
  $("restLabel").textContent = "Rest after " + label;
  $("restSheet").hidden = false;
  if(!rest.timer) rest.timer = setInterval(restTick, 250);
  restTick();
}
function stopRest(){
  clearInterval(rest.timer); rest.timer = null;
  clearTimeout(rest.hideId);
  $("restSheet").hidden = true;
}
function restTick(){
  const left = (rest.end - Date.now()) / 1000;
  if(left <= 0){
    clearInterval(rest.timer); rest.timer = null;
    $("restTime").textContent = "Go";
    $("restLabel").textContent = "Rest is over. Start your next set.";
    beep(880, 0.15); beep(880, 0.15, 0.2); buzz([200,100,200]);
    rest.hideId = setTimeout(() => { $("restSheet").hidden = true; }, 4000);
    return;
  }
  $("restTime").textContent = fmt(left);
}

/* ================= Circuit interval timer ================= */
let ui = null; // circuit element refs
let CIRC = null;
DAYS.forEach(d => d.sections.forEach((s, si) => s.items.forEach((it, ii) => { if(it.circuit) CIRC = {day:d.id, si, ii}; })));
const cs = {segs:[], i:0, running:false, started:false, done:false, segEnd:0, left:0, timer:null, wake:null};

function buildSegs(){
  const segs = [{type:"ready", dur:CIRCUIT.ready, round:1, st:0}];
  const n = STATIONS.length;
  for(let r = 1; r <= CIRCUIT.rounds; r++){
    for(let s = 0; s < n; s++){
      segs.push({type:"work", dur:CIRCUIT.work, round:r, st:s, last:s === n-1});
      if(s < n-1) segs.push({type:"rest", dur:CIRCUIT.rest, round:r, st:s+1});
    }
    if(r < CIRCUIT.rounds) segs.push({type:"roundrest", dur:CIRCUIT.roundRest, round:r+1, st:0});
  }
  return segs;
}
cs.segs = buildSegs();

async function wakeOn(){
  try{ if("wakeLock" in navigator && !cs.wake) cs.wake = await navigator.wakeLock.request("screen"); }catch(e){}
}
function wakeOff(){
  try{ if(cs.wake){ cs.wake.release(); cs.wake = null; } }catch(e){}
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && cs.running){ cs.wake = null; wakeOn(); cTick(); }
});

function mountCircuit(){
  const host = $("circuitHost");
  if(!host){ ui = null; return; }
  host.innerHTML = `<div class="circuit" id="cPanel" data-phase="idle">
    <p class="c-phase" id="cPhase" aria-live="polite"></p>
    <p class="c-time" id="cTime"></p>
    <p class="c-station" id="cStation"></p>
    <p class="c-meta" id="cMeta"></p>
    <div class="c-actions">
      <button class="btn primary" id="cGo" type="button"></button>
      <button class="btn" id="cReset" type="button">Reset</button>
    </div>
  </div>`;
  ui = {panel:$("cPanel"), phase:$("cPhase"), time:$("cTime"), station:$("cStation"), meta:$("cMeta"), go:$("cGo"), reset:$("cReset")};
  ui.go.addEventListener("click", () => { ensureAudio(); if(cs.running) pauseCircuit(); else startCircuit(); });
  ui.reset.addEventListener("click", resetCircuit);
  paintCircuit();
}
function startCircuit(){
  if(cs.done) resetCircuit();
  const now = Date.now();
  if(!cs.started){
    cs.started = true;
    cs.segEnd = now + cs.segs[cs.i].dur * 1000;
    beep(660, 0.12);
  }else{
    cs.segEnd = now + cs.left;
  }
  cs.running = true;
  clearInterval(cs.timer);
  cs.timer = setInterval(cTick, 200);
  wakeOn();
  paintCircuit();
}
function pauseCircuit(){
  cs.left = Math.max(0, cs.segEnd - Date.now());
  cs.running = false;
  clearInterval(cs.timer); cs.timer = null;
  wakeOff();
  paintCircuit();
}
function resetCircuit(){
  clearInterval(cs.timer); cs.timer = null;
  cs.i = 0; cs.running = false; cs.started = false; cs.done = false; cs.left = 0;
  wakeOff();
  paintCircuit();
}
function finishCircuit(){
  clearInterval(cs.timer); cs.timer = null;
  cs.running = false; cs.done = true;
  wakeOff();
  beep(523, 0.2); beep(659, 0.2, 0.22); beep(784, 0.35, 0.44);
  buzz([300,100,300,100,300]);
  paintCircuit();
}
function cTick(){
  const now = Date.now();
  let changed = false;
  while(cs.running && now >= cs.segEnd){
    const seg = cs.segs[cs.i];
    if(seg.type === "work" && seg.last && CIRC && root.current) setCheck(CIRC.day, `${CIRC.si}.${CIRC.ii}.${seg.round-1}`, true);
    if(cs.i >= cs.segs.length - 1){ finishCircuit(); return; }
    cs.i++;
    cs.segEnd += cs.segs[cs.i].dur * 1000;
    changed = true;
  }
  if(changed){
    const t = cs.segs[cs.i].type;
    if(t === "work"){ beep(880, 0.12); beep(880, 0.12, 0.18); buzz([250]); }
    else if(t === "rest"){ beep(520, 0.25); buzz([120]); }
    else { beep(440, 0.4); buzz([300]); }
  }
  paintCircuit();
}
function paintCircuit(){
  if(!ui) return;
  const seg = cs.segs[cs.i];
  let phase, station, meta, secs;
  if(cs.done){
    ui.panel.dataset.phase = "done";
    ui.phase.textContent = "Done";
    ui.time.textContent = "0:00";
    ui.station.textContent = "Circuit complete";
    ui.meta.textContent = "Nice work. Head to the finisher.";
    ui.go.textContent = "Run it again";
    ui.reset.disabled = false;
    return;
  }
  secs = cs.running ? (cs.segEnd - Date.now()) / 1000 : (cs.started ? cs.left / 1000 : seg.dur);
  const n = STATIONS.length;
  if(!cs.started){
    phase = "Ready"; station = "First up: " + STATIONS[0];
    meta = `${CIRCUIT.rounds} rounds of ${n} stations, ${CIRCUIT.work}s work and ${CIRCUIT.rest}s rest`;
    ui.panel.dataset.phase = "idle";
  }else if(seg.type === "ready"){
    phase = "Get ready"; station = "First up: " + STATIONS[0];
    meta = `Round 1 of ${CIRCUIT.rounds}`;
    ui.panel.dataset.phase = "ready";
  }else if(seg.type === "work"){
    phase = "Work"; station = STATIONS[seg.st];
    meta = `Round ${seg.round} of ${CIRCUIT.rounds}, station ${seg.st+1} of ${n}`;
    ui.panel.dataset.phase = "work";
  }else if(seg.type === "rest"){
    phase = "Rest"; station = "Next: " + STATIONS[seg.st];
    meta = `Round ${seg.round} of ${CIRCUIT.rounds}, station ${seg.st+1} of ${n} next`;
    ui.panel.dataset.phase = "rest";
  }else{
    phase = "Round rest"; station = "Next round: " + STATIONS[0];
    meta = `Round ${seg.round} of ${CIRCUIT.rounds} starts next`;
    ui.panel.dataset.phase = "roundrest";
  }
  if(cs.started && !cs.running) phase += " (paused)";
  ui.phase.textContent = phase;
  ui.time.textContent = fmt(secs);
  ui.station.textContent = station;
  ui.meta.textContent = meta;
  ui.go.textContent = cs.running ? "Pause" : (cs.started ? "Resume" : "Start circuit");
  ui.reset.disabled = !cs.started;
}

/* ================= Events ================= */
$("view").addEventListener("click", e => {
  const hex = e.target.closest(".hex");
  if(hex){
    ensureAudio();
    const key = hex.dataset.key;
    const next = hex.getAttribute("aria-pressed") !== "true";
    setCheck(root.tab, key, next);
    const restSec = parseInt(hex.dataset.rest, 10) || 0;
    if(next && restSec > 0 && hex.dataset.last !== "true") startRest(restSec, hex.dataset.name);
    return;
  }
  const clr = e.target.closest("[data-clearflow]");
  if(clr){
    const fi = clr.dataset.clearflow, p = P(), tab = root.tab;
    const c = p.checks[tab] || {};
    Object.keys(c).forEach(k => { if(k.indexOf("f" + fi + ".") === 0) delete c[k]; });
    save();
    document.querySelectorAll(`.flow[data-fi="${fi}"] .hex`).forEach(b => b.setAttribute("aria-pressed", "false"));
    updateFlowCounts();
    return;
  }
  const go = e.target.closest("[data-goto]");
  if(go){ setTab(go.dataset.goto); return; }
  const btn = e.target.closest("[data-act]");
  if(!btn) return;
  const p = P(), d = today();
  switch(btn.dataset.act){
    case "log": logSession(); break;
    case "unlog": unlogSession(); break;
    case "clear":
      if(confirm("Clear all checkmarks for this day?")){
        p.checks[root.tab] = {}; delete p.touched[root.tab]; save();
        document.querySelectorAll(".hex").forEach(b => b.setAttribute("aria-pressed", "false"));
        updateProgress(); updateFlowCounts();
      }
      break;
    case "water+": p.water[d] = Math.min(30, (p.water[d] || 0) + 1); save(); paintCare(); break;
    case "water-": p.water[d] = Math.max(0, (p.water[d] || 0) - 1); save(); paintCare(); break;
    case "extra+": p.extras[d] = Math.min(20, (p.extras[d] || 0) + 1); save(); paintCare(); buzz(40); break;
    case "extra-": p.extras[d] = Math.max(0, (p.extras[d] || 0) - 1); save(); paintCare(); break;
    case "switch": switchRider(); break;
    case "signout": signOut(); break;
  }
});

$("view").addEventListener("input", e => {
  const f = e.target.dataset && e.target.dataset.field;
  if(!f) return;
  const p = P(), v = e.target.value;
  if(f.indexOf("dragon.") === 0) p.dragon[f.slice(7)] = v; else p[f] = v;
  if(f === "rider" && !v.trim()) { /* keep stored name until a value is entered */ }
  else save();
  if(["rider","wing","section","squad"].indexOf(f) >= 0){ if(f !== "rider" || v.trim()) renderTopbar(); }
  if(f === "dragon.name"){ const t = $("heroTitle"); if(t) t.textContent = v.trim() || "Your dragon"; }
});

$("topbar").addEventListener("click", e => {
  const go = e.target.closest("[data-goto]");
  if(go) setTab(go.dataset.goto);
});
$("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if(t) setTab(t.dataset.day);
});
$("restAdd").addEventListener("click", () => {
  rest.end = Math.max(rest.end, Date.now()) + 15000;
  clearTimeout(rest.hideId);
  if(!rest.timer) rest.timer = setInterval(restTick, 250);
  restTick();
});
$("restSkip").addEventListener("click", stopRest);

/* ================= Boot ================= */
load();
if(isAuthed()){
  if(root.current && root.profiles[root.current]) enterApp();
  else showPicker();
}else{
  showLogin();
}
</script>
